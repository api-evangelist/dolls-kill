aid: dolls-kill
name: Dolls Kill
description: 'Dolls Kill is a Los Angeles-based online fashion boutique for alternative,
  punk, goth, glam, rave and festival style, founded in 2011 and operating dollskill.com
  plus physical store locations. Its commerce platform runs on Shopify, and its public
  machine-readable surface is agent-facing rather than a conventional developer program:
  the storefront serves an agents.md / llms.txt agent instruction document, a Universal
  Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live anonymous-readable
  MCP endpoint at /api/ucp/mcp exposing 13 catalog, cart, checkout and order tools,
  an openly introspectable Shopify Storefront GraphQL API, and OAuth 2.0 / OpenID
  Connect discovery for customer accounts. Dolls Kill publishes no developer portal,
  no OpenAPI, no SDKs and no API pricing — the API surface exists to let shopping
  agents transact, under an explicit human-approval-before-payment rule.'
