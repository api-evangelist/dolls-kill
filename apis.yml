apis:
- name: Dolls Kill UCP Commerce MCP API
  description: 'The Dolls Kill Universal Commerce Protocol (UCP) endpoint, served over
    MCP at /api/ucp/mcp. Anonymous tools/list returns 13 tools with full JSON Schema
    input contracts covering catalog search and lookup, product retrieval, cart create/read/update/cancel,
    checkout create/read/update/complete/cancel, and order retrieval. Tool invocation
    requires a resolvable UCP agent profile URI in meta.ucp-agent.profile; completing
    a checkout additionally requires meta.idempotency-key and explicit contemporaneous
    buyer approval of payment.'
  humanURL: https://www.dollskill.com/agents.md
  baseURL: https://www.dollskill.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/dolls-kill-mcp.yml
  - type: ToolCrosswalk
    url: mcp/dolls-kill-tool-crosswalk.yml
  - type: Documentation
    url: https://www.dollskill.com/agents.md
- name: Dolls Kill Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as served from Dolls Kill''s own
    host at /api/{version}/graphql.json. Anonymous introspection succeeds without a
    storefront access token, returning 424 types, 31 root query fields (product, products,
    collection, collections, search, predictiveSearch, cart, shop, menu, metaobjects,
    localization and more) and 41 mutations (the cart* family, customerAccessToken*,
    customer*, shopPayPaymentRequestSessionCreate). Versioned on Shopify''s dated release
    calendar; 2025-10 through 2026-07 are supported.'
  humanURL: https://www.dollskill.com/agents.md
  baseURL: https://www.dollskill.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - Storefront
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/dolls-kill-storefront.graphql
  - type: DataModel
    url: data-model/dolls-kill-data-model.yml
- name: Dolls Kill Storefront Product JSON API
  description: 'The read-only, unauthenticated JSON endpoints Dolls Kill documents in
    its own agents.md for agents that only need to browse the store: /products.json,
    /products/{handle}.json, /collections/{handle}/products.json, /search?q={query}&type=product,
    and /sitemap.xml. No credentials, no rate-limit headers, no versioning; the same
    Liquid-object JSON every Shopify storefront exposes.'
  humanURL: https://www.dollskill.com/agents.md
  baseURL: https://www.dollskill.com
  tags:
  - Products
  - Catalog
  - JSON
  - Read Only
  properties:
  - type: Documentation
    url: https://www.dollskill.com/agents.md
