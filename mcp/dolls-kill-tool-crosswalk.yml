mcp_only:
- tool: cancel_cart
  reason: No Storefront GraphQL mutation cancels or deletes a cart; the closest field
    is cartRemovePersonalData, which has different semantics. UCP-layer behaviour.
- tool: cancel_checkout
  reason: No Storefront GraphQL mutation cancels a checkout. UCP-layer behaviour with
    no public GraphQL equivalent.
- tool: get_order
  reason: The Storefront API exposes no order query. Order retrieval lives on Shopify's
    Customer Account API, which requires the customer-account-api:full OAuth scope
    (see scopes/dolls-kill-scopes.yml).
