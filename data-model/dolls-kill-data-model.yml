observations:
- 'The commerce spine is Product -> ProductVariant -> CartLine -> Cart -> Order. An
  agent must resolve a Product to a ProductVariant GID before it can build a cart —
  the variant, not the product, is the purchasable unit.'
- 'Order is the one core entity with no Storefront root query, which is exactly the
  boundary between the anonymous agent surface and the OAuth-gated customer surface.'
